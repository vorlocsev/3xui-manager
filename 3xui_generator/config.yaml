name: 3x-ui Manager
version: 4.2.0
slug: 3xui_manager
description: Home Assistant App for managing remote 3x-ui VLESS Reality inbounds, clients and subscriptions.
url: https://github.com/vorlocsev/3xui-manager
arch:
  - amd64
  - aarch64
homeassistant: "2026.4.0"
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:vpn
panel_title: 3x-ui Manager
panel_admin: true
watchdog: http://127.0.0.1:8099/health
backup: hot
stage: stable
options:
  3xui_url: null
  api_token: null
  verify_tls: true
  server_address: ""
  subscription_base_url: ""
schema:
  3xui_url: url
  api_token: password
  verify_tls: bool
  server_address: str?
  subscription_base_url: url?
