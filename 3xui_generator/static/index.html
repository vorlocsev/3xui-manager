<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3x-ui Manager</title>
<style>
body{font:14px system-ui;max-width:1250px;margin:auto;padding:16px;background:#111;color:#eee}
section{background:#1d1d1d;padding:16px;margin:12px 0;border-radius:12px}
button,input{padding:8px;border-radius:7px;border:1px solid #555;background:#111;color:#eee;margin:3px}
button{cursor:pointer;background:#3478f6;border:0}button.d{background:#a33}button.s{background:#555}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #444;text-align:left}
#msg{white-space:pre-wrap}.ok{color:#6f6}.bad{color:#f77}
</style></head><body>
<h1>3x-ui Manager <small>v4.3.0</small></h1>
<section><button onclick="load()">Обновить</button> <button onclick="newInbound()">+ Создать inbound</button> <button onclick="newClient()">+ Добавить клиента</button>
<button class="s" onclick="cleanup()">Очистить depleted/orphans</button> <span id="st"></span></section>
<section><h2>Inbound'ы</h2><div id="ib">Загрузка…</div></section>
<section><h2>Клиенты</h2><div id="cl">Загрузка…</div></section>
<section id="msg"></section>
<script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function api(u,o){
 if(u.startsWith('/'))u=u.slice(1);
 let r=await fetch(u,o);
 let t=await r.text();
 let d;
 try{d=JSON.parse(t)}catch(e){throw Error('HTTP '+r.status+': '+t.slice(0,500))}
 if(!r.ok||d.success===false)throw Error(d.msg||r.status);
 return d
}
function out(x){$('msg').textContent=x||''}
async function load(){
 try{await api('/api/status');$('st').innerHTML='<span class="ok">● 3x-ui OK</span>'}catch(e){$('st').innerHTML='<span class="bad">● '+esc(e.message)+'</span>'}
 try{let d=await api('/api/inbounds'),a=d.obj||[];$('ib').innerHTML='<table><tr><th>ID</th><th>Название</th><th>Port</th><th>Клиенты</th><th>State</th><th></th></tr>'+a.map(x=>{let n=(x.settings?.clients||[]).length;return '<tr><td>'+x.id+'</td><td>'+esc(x.remark)+'</td><td>'+x.port+'</td><td>'+n+'</td><td>'+(x.enable?'ON':'OFF')+'</td><td><button onclick="en('+x.id+','+(!x.enable)+')">'+(x.enable?'OFF':'ON')+'</button> <button onclick="resetib('+x.id+')">Сброс</button> <button class="d" onclick="delib('+x.id+')">Удалить</button></td></tr>'}).join('')+'</table>'}catch(e){$('ib').textContent=e.message}
 try{let d=await api('/api/clients'),a=d.obj||[];$('cl').innerHTML='<table><tr><th>Email</th><th>State</th><th>Traffic</th><th>Expiry</th><th></th></tr>'+a.map(x=>'<tr><td>'+esc(x.email)+'</td><td>'+(x.enable?'ON':'OFF')+'</td><td>'+((Number(x.traffic?.up||x.up||0)+Number(x.traffic?.down||x.down||0))/1073741824).toFixed(2)+' GB</td><td>'+expiry(x.expiryTime)+'</td><td><button onclick="ce('+JSON.stringify(encodeURIComponent(x.email))+','+(!x.enable)+')">'+(x.enable?'OFF':'ON')+'</button> <button onclick="link('+JSON.stringify(encodeURIComponent(x.email))+')">VLESS</button> <button onclick="ips('+JSON.stringify(encodeURIComponent(x.email))+')">IP</button> <button onclick="hwids('+JSON.stringify(encodeURIComponent(x.email))+')">HWID</button> <button onclick="resetc('+JSON.stringify(encodeURIComponent(x.email))+')">Сброс</button> <button class="d" onclick="delc('+JSON.stringify(encodeURIComponent(x.email))+')">Удалить</button></td></tr>').join('')+'</table>'}catch(e){$('cl').textContent=e.message}
}
function expiry(v){if(!v)return '—';let d=new Date(Number(v));return isNaN(d)?'—':d.toLocaleString()}
async function action(fn){try{await fn();load()}catch(e){out('Ошибка: '+e.message)}}
async function en(id,v){await action(()=>api('/api/inbounds/'+id+'/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enable:v})}))}
async function resetib(id){if(confirm('Сбросить трафик inbound?'))await action(()=>api('/api/inbounds/'+id+'/reset-traffic',{method:'POST'}))}
async function delib(id){if(confirm('Удалить inbound?'))await action(()=>api('/api/inbounds/'+id,{method:'DELETE'}))}
async function ce(e,v){await action(()=>api('/api/clients/'+e+'/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enable:v})}))}
async function resetc(e){if(confirm('Сбросить трафик клиента?'))await action(()=>api('/api/clients/'+e+'/reset-traffic',{method:'POST'}))}
async function delc(e){if(confirm('Удалить клиента?'))await action(()=>api('/api/clients/'+e,{method:'DELETE'}))}
async function ips(e){await action(async()=>{let d=await api('/api/clients/'+e+'/ips',{method:'POST'});out('IP клиента '+decodeURIComponent(e)+':\n'+JSON.stringify(d.obj||d,null,2))})}
async function hwids(e){await action(async()=>{let d=await api('/api/clients/'+e+'/hwids',{method:'POST'});out('HWID клиента '+decodeURIComponent(e)+':\n'+JSON.stringify(d.obj||d,null,2))})}
async function link(e){
 try{
  let d=await api('/api/clients/'+e+'/link'); let text='VLESS:\n'+d.link+(d.subscription?'\n\nSubscription:\n'+d.subscription:'');
  let q=await api('/api/qr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link:d.link})});
  out(text+'\n\nQR:');
  let img=document.createElement('img');img.src='data:image/png;base64,'+q.png_base64;img.style.maxWidth='320px';$('msg').appendChild(document.createElement('br'));$('msg').appendChild(img);
 }catch(err){out(err.message)}
}
async function cleanup(){if(confirm('Удалить depleted и orphan клиентов?')){await api('/api/clients/del-depleted',{method:'POST'});await api('/api/clients/del-orphans',{method:'POST'});load()}}
async function newInbound(){
 $('msg').innerHTML='<h3>Создать VLESS Reality inbound</h3><input id="ir" placeholder="Название" value="VLESS Reality"><input id="ip" type="number" value="443" placeholder="Порт"><input id="is" placeholder="SNI"><input id="id" placeholder="Destination, например www.cloudflare.com:443"><button onclick="createInbound()">Создать</button>';
}
async function createInbound(){
 try{
  let p={remark:$('ir').value,port:Number($('ip').value),sni:$('is').value,dest:$('id').value};
  if(!p.remark||!p.port||!p.sni||!p.dest)throw Error('Заполни все поля');
  let d=await api('/api/inbounds/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  out('Inbound создан: #'+d.inbound.id+' '+d.inbound.remark);load();
 }catch(e){out('Ошибка создания inbound: '+e.message)}
}
async function newClient(){
 try{
  let d=await api('/api/inbounds'), a=(d.obj||[]).filter(x=>x.protocol==='vless'&&(x.streamSettings?.security==='reality'||x.streamSettings?.realitySettings));
  if(!a.length){out('Сначала создай VLESS Reality inbound');return}
  let opts=a.map(x=>'<option value="'+x.id+'">'+esc(x.remark)+' — '+x.port+'</option>').join('');
  $('msg').innerHTML='<h3>Добавить клиента</h3><select id="ci">'+opts+'</select><input id="ce" placeholder="Email клиента"><select id="cg"><option value="0">Без лимита</option><option value="10">10 GB</option><option value="30">30 GB</option><option value="50">50 GB</option><option value="100">100 GB</option><option value="200">200 GB</option><option value="500">500 GB</option><option value="1000">1000 GB</option></select><button onclick="createClient()">Создать клиента</button>';
 }catch(e){out('Ошибка: '+e.message)}
}
async function createClient(){
 try{
  let email=$('ce').value.trim(),iid=Number($('ci').value),gb=Number($('cg').value);
  if(!email)throw Error('Укажи email');
  let cfg=await api('/api/settings'), address=cfg.server_address||prompt('Server address / domain');
  if(!address)throw Error('Не указан server address');
  let d=await api('/api/clients/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,inbound_id:iid,total_gb:gb,server_address:address})});
  out('Клиент создан:\n'+d.link);load();
 }catch(e){out('Ошибка создания клиента: '+e.message)}
}
load();
</script></body></html>
