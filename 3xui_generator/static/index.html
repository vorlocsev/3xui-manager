<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3x-ui Manager</title>
<style>
:root{color-scheme:dark}
body{font:15px system-ui,-apple-system,sans-serif;max-width:1050px;margin:auto;padding:14px;background:#111;color:#eee}
section{background:#1b1b1b;padding:14px;margin:10px 0;border-radius:12px}
h1{font-size:22px;margin:4px 0 14px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.lang{font-size:13px;color:#aaa}.lang select{margin:0;padding:6px}h2{font-size:18px;margin:0 0 10px}
button,input,select{padding:9px;border-radius:8px;border:1px solid #4a4a4a;background:#111;color:#eee;margin:3px}
button{cursor:pointer;background:#3478f6;border:0}button:disabled{opacity:.45;cursor:not-allowed}
button.s{background:#3478f6}button.s[data-enable="true"]{background:#2e8b57}button.s[data-enable="false"]{background:#b06a00}button.d{background:#a33}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.status{margin-left:auto}
.client{background:#242424;border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.name{font-weight:650;font-size:16px;overflow-wrap:anywhere}.presence{font-size:13px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-right:5px}.online .dot{background:#39d353}.online{color:#72e28a}.offline{color:#aaa}
.meta{color:#aaa;font-size:13px;margin:6px 0}.actions{display:flex;gap:5px;flex-wrap:wrap}
.linkbox{display:none;margin-top:9px;padding:9px;background:#111;border-radius:8px;word-break:break-all;color:#bbb;font-size:12px}
.ibrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #333;flex-wrap:wrap}
#msg{white-space:pre-wrap}.ok{color:#72e28a}.bad{color:#ff7777}
small{color:#999}.updateNotice{display:none;background:#3a2f08;border:1px solid #8a6d1d;border-radius:10px;padding:10px;margin-bottom:10px}.updateNotice.show{display:block}.updateNotice b{color:#ffd86b}
 .wizard{max-width:720px;margin:auto}.wizard .steps{display:flex;gap:6px;margin:8px 0 18px}.wizard .step{flex:1;text-align:center;padding:9px 5px;border-radius:9px;background:#252525;color:#888;font-size:12px}.wizard .step.active{background:#3478f6;color:#fff}.wizard .choice{display:block;padding:14px;margin:8px 0;background:#242424;border:1px solid #3b3b3b;border-radius:12px;cursor:pointer}.wizard .choice:hover{border-color:#3478f6}.wizard .choice input{margin-right:8px}.wizard .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wizard label{display:block;color:#bbb;margin:8px 0}.wizard input,.wizard select{box-sizing:border-box;width:100%;margin:4px 0}.wizard .presets{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 10px}.wizard .preset{background:#252525;border:1px solid #444}.wizard .preset.active{background:#3478f6;border-color:#3478f6}.wizard .summary{background:#111;border-radius:10px;padding:12px;line-height:1.7}.wizard .hint{color:#888;font-size:12px;margin-top:5px}@media(max-width:600px){.wizard .grid{grid-template-columns:1fr}.wizard .steps .step{font-size:11px}.wizard .steps .step span{display:none}}</style></head><body>
<div class="topbar"><h1>3x-ui Manager <small>v4.6.0</small></h1><label class="lang">🌐 <select id="lang" onchange="setLang(this.value)"><option value="ru">Русский</option><option value="en">English</option></select></label></div>
<section><div id="updateNotice" class="updateNotice"></div><div id="panelInfo" style="margin-bottom:8px">3x-ui: проверка…</div><div class="toolbar">
<button onclick="load()">Обновить</button>
<button onclick="newClient()">+ Клиент</button>
<button onclick="openWizard()">🧙 Мастер создания</button>
<button class="s" onclick="newInbound()">Inbound</button>
<span id="st" class="status"></span>
</div></section>
<section><h2>Клиенты <small id="count"></small></h2><div id="cl">Загрузка…</div></section>
<section><h2>Inbound'ы</h2><div id="ib">Загрузка…</div></section>
<section id="msg"></section>
<script>

const I18N={
ru:{
'Обновить':'Обновить','+ Клиент':'+ Клиент','+ Inbound + клиент':'+ Inbound + клиент','🧙 Мастер создания':'🧙 Мастер создания','Inbound':'Inbound',
'Клиенты':'Клиенты','Inbound\'ы':"Inbound'ы",'Загрузка…':'Загрузка…','Клиентов пока нет.':'Клиентов пока нет.','Inbound\'ов нет.':"Inbound'ов нет.",
'без лимита':'без лимита','только что':'только что','мин назад':'мин назад','ч назад':'ч назад','дн назад':'дн назад',
'Скопировать':'Скопировать','Telegram':'Telegram','QR':'QR','Выключить':'Выключить','Включить':'Включить','Удалить':'Удалить',
'последняя стабильная':'последняя стабильная','доступна':'доступна','Обновить сейчас':'Обновить сейчас',
'проверка…':'проверка…','● 3x-ui OK':'● 3x-ui OK',
'Новый VLESS Reality':'Новый VLESS Reality','Название':'Название','Порт':'Порт','SNI':'SNI',
'Destination, например www.cloudflare.com:443':'Destination, например www.cloudflare.com:443','Создать':'Создать',
'Новый клиент':'Новый клиент','Email клиента':'Email клиента','Без лимита':'Без лимита','Свой лимит, GB':'Свой лимит, GB',
'Inbound + клиент':'Inbound + клиент','Название inbound':'Название inbound','Email клиента':'Email клиента',
'Ошибка:':'Ошибка:','Заполни все поля':'Заполни все поля','Укажи email':'Укажи email',
'Не указан server address':'Не указан server address','Сначала создай VLESS Reality inbound':'Сначала создай VLESS Reality inbound',
'Клиент создан. Теперь можно скопировать ссылку или отправить её через Telegram.':'Клиент создан. Теперь можно скопировать ссылку или отправить её через Telegram.',
'Inbound + клиент созданы. Теперь можно скопировать ссылку или отправить её через Telegram.':'Inbound + клиент созданы. Теперь можно скопировать ссылку или отправить её через Telegram.',
'Inbound создан':'Inbound создан','Ссылка клиента ':'Ссылка клиента ',' скопирована.':' скопирована.',
'Обновление 3x-ui запущено. Панель может быть недоступна несколько секунд.':'Обновление 3x-ui запущено. Панель может быть недоступна несколько секунд.',
'Обновление 3x-ui до последней стабильной версии? Панель 3x-ui перезапустится.':'Обновление 3x-ui до последней стабильной версии? Панель 3x-ui перезапустится.'
},
en:{
'Обновить':'Refresh','+ Клиент':'+ Client','+ Inbound + клиент':'+ Inbound + client','Inbound':'Inbound',
'Клиенты':'Clients','Inbound\'ы':"Inbounds",'Загрузка…':'Loading…','Клиентов пока нет.':'No clients yet.','Inbound\'ов нет.':"No inbounds.",
'без лимита':'unlimited','только что':'just now','мин назад':'min ago','ч назад':'h ago','дн назад':'d ago',
'Скопировать':'Copy','Telegram':'Telegram','QR':'QR','Выключить':'Disable','Включить':'Enable','Удалить':'Delete',
'последняя стабильная':'latest stable','доступна':'available','Обновить сейчас':'Update now',
'проверка…':'checking…','● 3x-ui OK':'● 3x-ui OK',
'Новый VLESS Reality':'New VLESS Reality','Название':'Name','Порт':'Port','SNI':'SNI',
'Destination, например www.cloudflare.com:443':'Destination, e.g. www.cloudflare.com:443','Создать':'Create',
'Новый клиент':'New client','Email клиента':'Client email','Без лимита':'Unlimited','Свой лимит, GB':'Custom limit, GB',
'Inbound + клиент':'Inbound + client','Название inbound':'Inbound name',
'Ошибка:':'Error:','Заполни все поля':'Fill in all fields','Укажи email':'Enter client email',
'Не указан server address':'Server address is not set','Сначала создай VLESS Reality inbound':'Create a VLESS Reality inbound first',
'Клиент создан. Теперь можно скопировать ссылку или отправить её через Telegram.':'Client created. You can now copy the link or share it via Telegram.',
'Inbound + клиент созданы. Теперь можно скопировать ссылку или отправить её через Telegram.':'Inbound + client created. You can now copy the link or share it via Telegram.',
'Inbound создан':'Inbound created','Ссылка клиента ':'Client link ',' скопирована.':' copied.',
'Обновление 3x-ui запущено. Панель может быть недоступна несколько секунд.':'3x-ui update started. The panel may be unavailable for a few seconds.',
'Обновление 3x-ui до последней стабильной версии? Панель 3x-ui перезапустится.':'Update 3x-ui to the latest stable version? The 3x-ui panel will restart.'
}};
let LANG=localStorage.getItem('3xui-manager-lang')||'ru';
function tr(s){let d=I18N[LANG]||I18N.ru;let out=String(s??'');Object.keys(d).sort((a,b)=>b.length-a.length).forEach(k=>{out=out.split(k).join(d[k])});return out}
function setLang(v){LANG=v==='en'?'en':'ru';localStorage.setItem('3xui-manager-lang',LANG);applyLang();load()}
function applyLang(){
  let sel=$('lang');if(sel)sel.value=LANG;
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=tr(e.dataset.i18n)});
  let h=document.querySelector('h1');if(h)h.innerHTML='3x-ui Manager <small>v4.6.0</small>';
  let hs=document.querySelectorAll('section h2');if(hs[0])hs[0].innerHTML=tr('Клиенты')+' <small id="count"></small>';if(hs[1])hs[1].textContent=tr("Inbound'ы"); translateVisible();
}

const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const enc=encodeURIComponent,links={};
async function api(u,o){if(u.startsWith('/'))u=u.slice(1);let r=await fetch(u,o),t=await r.text(),d;try{d=JSON.parse(t)}catch(e){throw Error('HTTP '+r.status+': '+t.slice(0,400))}if(!r.ok||d.success===false)throw Error(d.msg||r.status);return d}
function translateVisible(){document.querySelectorAll('input[placeholder],button,option,h3').forEach(e=>{if(e.placeholder)e.placeholder=tr(e.placeholder);if(e.tagName!=='INPUT')e.textContent=tr(e.textContent)});let n=document.querySelector('#updateNotice');if(n&&n.innerHTML)n.innerHTML=tr(n.innerHTML)}
function out(x){$('msg').textContent=tr(x||'')}
function gb(x){return((Number(x?.traffic?.up||x?.up||0)+Number(x?.traffic?.down||x?.down||0))/1073741824).toFixed(2)}
function expiry(v){if(!v)return'без срока';let d=new Date(Number(v));return isNaN(d)?'—':d.toLocaleString()}
function ago(v){if(!v)return'';let n=Date.now()-Number(v)*1000;if(n<60000)return tr('только что');if(n<3600000)return Math.floor(n/60000)+' '+tr('мин назад');if(n<86400000)return Math.floor(n/3600000)+' '+tr('ч назад');return Math.floor(n/86400000)+' '+tr('дн назад')}
async function presence(){try{let d=await api('/api/clients/presence',{method:'POST'});return{online:new Set(d.online||[]),last:d.last_online||{}}}catch(e){return{online:new Set(),last:{}}}}
async function loadClients(){let d=await api('/api/clients'),a=d.obj||[],p=await presence();$('count').textContent='— '+a.length;$('cl').innerHTML=a.length?a.map(x=>{let on=p.online.has(x.email),last=p.last[x.email],key=enc(x.email);return '<div class="client"><div class="row"><div class="name">'+esc(x.email)+'</div><div class="presence '+(on?'online':'offline')+'"><span class="dot"></span>'+(on?'ONLINE':'offline')+(on?'':' '+(ago(last)||''))+'</div></div><div class="meta">'+gb(x)+' GB использовано · '+(x.totalGB?((Number(x.totalGB)/1073741824).toFixed(0)+' GB '+(LANG==='en'?'limit · ':'лимит · ')):(LANG==='en'?'unlimited · ':'без лимита · '))+expiry(x.expiryTime)+'</div><div class="actions"><button data-action="copy" data-email="'+esc(x.email)+'">📋 '+(LANG==='en'?'Copy':'Скопировать')+'</button><button data-action="telegram" data-email="'+esc(x.email)+'">✈ Telegram</button><button data-action="qr" data-email="'+esc(x.email)+'">▦ QR</button><button class="s" data-action="enable" data-enable="'+(!x.enable)+'" data-email="'+esc(x.email)+'">'+(x.enable?(LANG==='en'?'Disable':'Выключить'):(LANG==='en'?'Enable':'Включить'))+'</button><button class="d" data-action="delete" data-email="'+esc(x.email)+'">'+(LANG==='en'?'Delete':'Удалить')+'</button></div><div class="linkbox" id="l_'+key+'"></div></div>'}).join(''):'<small>Клиентов пока нет.</small>';}
$('cl').addEventListener('click',async e=>{let b=e.target.closest('button[data-action]');if(!b)return;let email=b.dataset.email,action=b.dataset.action;try{b.disabled=true;if(action==='copy')await copyLink(email);else if(action==='telegram')await telegram(email);else if(action==='qr')await showQr(email);else if(action==='enable')await ce(email,b.dataset.enable==='true');else if(action==='delete')await delc(email)}catch(err){out('Ошибка: '+err.message)}finally{b.disabled=false}});
async function loadInbounds(){let d=await api('/api/inbounds'),a=d.obj||[];$('ib').innerHTML=a.length?a.map(x=>'<div class="ibrow"><span><b>'+esc(x.remark)+'</b> · '+x.protocol+' : '+x.port+' · '+(x.enable?'ON':'OFF')+'</span><span><button class="s" onclick="en('+x.id+','+(!x.enable)+')">'+(x.enable?'OFF':'ON')+'</button><button class="d" onclick="delib('+x.id+')">Удалить</button></span></div>').join(''):'<small>'+esc(tr("Inbound'ов нет."))+'</small>'; $('ib').innerHTML=tr($('ib').innerHTML)}
function normVer(v){return String(v||'').trim().replace(/^v/i,'')}
function notifyNewVersion(cur,latest){let n=$('updateNotice');if(!latest||!cur||normVer(latest)===normVer(cur)){n.className='updateNotice';n.innerHTML='';return}n.className='updateNotice show';n.innerHTML='<b>🔔 '+(LANG==='en'?'New 3x-ui version available: ':'Доступна новая версия 3x-ui: ')+esc(latest)+'</b><br>'+(LANG==='en'?'Installed: ':'Установлена: ')+esc(cur)+' <button onclick="updatePanel()">'+tr('Обновить сейчас')+'</button>';try{if('Notification' in window&&Notification.permission==='granted')new Notification(LANG==='en'?'3x-ui: new version available':'3x-ui: доступна новая версия',{body:latest+' ('+(LANG==='en'?'installed ':'установлена ')+cur+')'});else if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
async function panelInfo(){try{let d=await api('/api/panel-info'),s=d.status||{},u=d.update||{},cur=u.currentVersion||s.version||s.xuiVersion||s.xui_version||'—',latest=u.latestVersion||u.version||u.latest||u.tag||'';notifyNewVersion(cur,latest);let newer=Boolean(u.updateAvailable)||Boolean(latest&&normVer(latest)!==normVer(cur));$('panelInfo').innerHTML='<b>3x-ui:</b> '+esc(cur)+(newer?' → <b>'+tr('доступна')+' '+esc(latest)+'</b> <button onclick="updatePanel()">'+(LANG==='en'?'Update 3x-ui':'Обновить 3x-ui')+'</button>':' <span class="ok">✓ '+tr('последняя стабильная')+'</span>')}catch(e){$('panelInfo').innerHTML='<b>3x-ui:</b> <span class="bad">'+esc(e.message)+'</span>'}}
async function updatePanel(){if(!confirm(tr('Обновление 3x-ui до последней стабильной версии? Панель 3x-ui перезапустится.')))return;try{$('panelInfo').textContent=LANG==='en'?'3x-ui update started…':'Обновление 3x-ui запущено…';$('updateNotice').className='updateNotice';let r=await api('/api/panel-update',{method:'POST'}),runId=String(r.obj?.runId||'');out('Обновление 3x-ui запущено. Панель может быть недоступна несколько секунд.');if(runId){let tries=0;let poll=async()=>{tries++;try{let s=await api('/api/panel-update-status'),o=s.obj||{};if(String(o.runId||'')===runId&&o.state==='success'){out(LANG==='en'?'3x-ui update completed successfully.':'Обновление 3x-ui успешно завершено.');setTimeout(panelInfo,1500);return}if(String(o.runId||'')===runId&&o.state==='failed'){out((LANG==='en'?'3x-ui update failed: ':'Ошибка обновления 3x-ui: ')+(o.message||s.msg||'unknown error'));panelInfo();return}}catch(e){}if(tries<20)setTimeout(poll,3000);else setTimeout(panelInfo,1000)};setTimeout(poll,3000)}else{setTimeout(panelInfo,5000);setTimeout(panelInfo,15000)}}catch(e){out('Ошибка обновления 3x-ui: '+e.message);panelInfo()}}
async function load(){panelInfo();try{await api('/api/status');$('st').innerHTML='<span class="ok">● 3x-ui OK</span>'}catch(e){$('st').innerHTML='<span class="bad">● '+esc(e.message)+'</span>'}try{await Promise.all([loadClients(),loadInbounds()])}catch(e){out('Ошибка: '+e.message)}}
async function getLink(email){if(links[email])return links[email];let d=await api('/api/clients/'+enc(email)+'/link');links[email]=d.link;return d.link}
async function copyLink(email){try{let l=await getLink(email);if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(l);else{let t=document.createElement('textarea');t.value=l;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}out('Ссылка клиента '+email+' скопирована.')}catch(e){out('Ошибка: '+e.message)}}
async function telegram(email){try{let l=await getLink(email);window.open('https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent('VLESS для '+email),'_blank')}catch(e){out('Ошибка: '+e.message)}}
async function showQr(email){try{let l=await getLink(email),q=await api('/api/qr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link:l})}),b=$('l_'+enc(email));b.style.display='block';b.innerHTML='<b>VLESS</b><br>'+esc(l)+'<br><br><img alt="QR" style="width:240px;max-width:100%" src="data:image/png;base64,'+q.png_base64+'>'}catch(e){out('Ошибка: '+e.message)}}
async function ce(email,v){try{await api('/api/clients/'+enc(email)+'/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enable:v})});load()}catch(e){out('Ошибка: '+e.message)}}
async function delc(email){if(!confirm('Удалить клиента '+email+'?'))return;try{await api('/api/clients/'+enc(email),{method:'DELETE'});delete links[email];load()}catch(e){out('Ошибка: '+e.message)}}
async function en(id,v){try{await api('/api/inbounds/'+id+'/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enable:v})});loadInbounds()}catch(e){out('Ошибка: '+e.message)}}
async function delib(id){if(!confirm('Удалить inbound?'))return;try{await api('/api/inbounds/'+id,{method:'DELETE'});load()}catch(e){out('Ошибка: '+e.message)}}
async function newInbound(){$('msg').innerHTML='<h3>Новый VLESS Reality</h3><input id="ir" placeholder="Название" value="VLESS Reality"><input id="ip" type="number" value="443" placeholder="Порт"><input id="is" placeholder="SNI"><input id="id" placeholder="Destination, например www.cloudflare.com:443"><button id="createIbBtn" onclick="createInbound()">Создать</button>'; $('msg').innerHTML=tr($('msg').innerHTML);translateVisible()}
async function createInbound(){let b=$('createIbBtn');b.disabled=true;try{let p={remark:$('ir').value,port:Number($('ip').value),sni:$('is').value,dest:$('id').value};if(!p.remark||!p.port||!p.sni||!p.dest)throw Error('Заполни все поля');await api('/api/inbounds/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});out('Inbound создан');load()}catch(e){b.disabled=false;out('Ошибка: '+e.message)}}
async function newClient(){try{let d=await api('/api/inbounds'),a=(d.obj||[]).filter(x=>x.protocol==='vless'&&(x.streamSettings?.security==='reality'||x.streamSettings?.realitySettings));if(!a.length){out('Сначала создай VLESS Reality inbound');return}let opts=a.map(x=>'<option value="'+x.id+'">'+esc(x.remark)+' — '+x.port+'</option>').join('');$('msg').innerHTML='<h3>Новый клиент</h3><select id="ci">'+opts+'</select><input id="ce" placeholder="Email клиента"><select id="cg"><option value="0">Без лимита</option><option value="10">10 GB</option><option value="30">30 GB</option><option value="50">50 GB</option><option value="100">100 GB</option><option value="200">200 GB</option><option value="500">500 GB</option><option value="1000">1000 GB</option></select><input id="cgCustom" type="number" min="0" placeholder="Свой лимит, GB"><button id="createClBtn" onclick="createClient()">Создать</button>'}catch(e){out('Ошибка: '+e.message)}}
async function createClient(){let b=$('createClBtn');b.disabled=true;try{let email=$('ce').value.trim(),iid=Number($('ci').value),custom=Number($('cgCustom').value),gb=custom>0?custom:Number($('cg').value);if(!email)throw Error('Укажи email');let cfg=await api('/api/settings'),address=cfg.server_address||prompt('Server address / domain');if(!address)throw Error('Не указан server address');let d=await api('/api/clients/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,inbound_id:iid,total_gb:gb,server_address:address})});links[email]=d.link;out('Клиент создан. Теперь можно скопировать ссылку или отправить её через Telegram.');load()}catch(e){b.disabled=false;out('Ошибка: '+e.message)}}
async function newSetup(){$('msg').innerHTML='<h3>Inbound + клиент</h3><input id="sr" placeholder="Название inbound" value="VLESS Reality"><input id="sp" type="number" value="443"><input id="ss" placeholder="SNI"><input id="sd" placeholder="Destination, например www.cloudflare.com:443"><input id="se" placeholder="Email клиента"><select id="sg"><option value="0">Без лимита</option><option value="10">10 GB</option><option value="30">30 GB</option><option value="50">50 GB</option><option value="100">100 GB</option><option value="200">200 GB</option><option value="500">500 GB</option><option value="1000">1000 GB</option></select><input id="sgc" type="number" min="0" placeholder="Свой лимит, GB"><button id="setupBtn" onclick="createSetup()">Создать</button>'}
async function createSetup(){let b=$('setupBtn');b.disabled=true;try{let cfg=await api('/api/settings'),address=cfg.server_address||prompt('Server address / domain');if(!address)throw Error('Не указан server address');let custom=Number($('sgc').value),gb=custom>0?custom:Number($('sg').value),p={remark:$('sr').value,port:Number($('sp').value),sni:$('ss').value,dest:$('sd').value,email:$('se').value,total_gb:gb,server_address:address};if(!p.remark||!p.port||!p.sni||!p.dest||!p.email)throw Error('Заполни все поля');let d=await api('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});links[p.email]=d.link;out('Inbound + клиент созданы. Теперь можно скопировать ссылку или отправить её через Telegram.');load()}catch(e){b.disabled=false;out('Ошибка: '+e.message)}}

function openWizard(){
  WIZ={step:1,mode:'existing',inbounds:[],data:{email:'',remark:'VLESS Reality',port:443,sni:'',dest:'',inbound_id:0,total_gb:100,custom_gb:0,days:30,ip_limit:0,hwid_limit:0,fingerprint:'chrome'}};
  $('msg').innerHTML='<div class="wizard"><h3>🧙 '+tr('Мастер создания')+'</h3><div class="steps" id="wizSteps"></div><div id="wizBody"></div><div class="row" style="margin-top:14px"><button id="wizBack" class="s" onclick="wizBack()">← '+tr('Назад')+'</button><button id="wizNext" onclick="wizNext()">Далее →</button></div></div>';
  loadWizardInbounds();
}
async function loadWizardInbounds(){try{let d=await api('/api/inbounds');WIZ.inbounds=(d.obj||[]).filter(x=>x.protocol==='vless'&&(x.streamSettings?.security==='reality'||x.streamSettings?.realitySettings));renderWizard()}catch(e){out('Ошибка: '+e.message)}}
function wizData(){return WIZ.data}
function wizSteps(){let names=['1. '+tr('Тип'),'2. '+tr('Клиент'),'3. '+tr('Подключение'),'4. '+tr('Готово')];$('wizSteps').innerHTML=names.map((x,i)=>'<div class="step '+(i+1===WIZ.step?'active':'')+'">'+esc(x)+'</div>').join('')}
function renderWizard(){
  let d=wizData(),b=$('wizBody');if(!b)return;wizSteps();$('wizBack').style.display=WIZ.step===1?'none':'inline-block';$('wizNext').textContent=WIZ.step===4?(LANG==='en'?'Create':'Создать'):'Далее →';
  if(WIZ.step===1){
    b.innerHTML='<p>'+tr('Выбери сценарий')+'</p><label class="choice"><input type="radio" name="wm" value="existing" '+(WIZ.mode==='existing'?'checked':'')+'> <b>'+tr('Существующий сервер')+'</b><br><small>'+tr('Добавить нового клиента в готовый VLESS Reality inbound')+'</small></label><label class="choice"><input type="radio" name="wm" value="new" '+(WIZ.mode==='new'?'checked':'')+'> <b>'+tr('Новый сервер')+'</b><br><small>'+tr('Создать VLESS Reality inbound и клиента одновременно')+'</small></label>';
    if(WIZ.mode==='existing'){let opts=WIZ.inbounds.map(x=>'<option value="'+x.id+'">'+esc(x.remark)+' · :'+x.port+'</option>').join('');b.innerHTML+='<label>'+tr('Inbound')+'<select id="wi">'+opts+'</select></label>'}
    else b.innerHTML+='<div class="hint">SNI, Destination и ключи Reality зададим на следующем шаге.</div>';
    document.querySelectorAll('input[name="wm"]').forEach(x=>x.onchange=()=>{WIZ.mode=x.value;renderWizard()});
  }else if(WIZ.step===2){
    b.innerHTML='<div class="grid"><label>'+tr('Имя клиента')+'<input id="we" placeholder="iPhone, MacBook, Android..." value="'+esc(d.email)+'"></label><label>'+tr('Срок, дней')+'<input id="wd" type="number" min="0" value="'+d.days+'"></label></div><label>'+tr('Трафик')+'</label><div class="presets">'+[0,10,30,50,100,200,500,1000].map(x=>'<button type="button" class="preset '+((d.custom_gb===0&&d.total_gb===x)?'active':'')+'" onclick="setWizGb('+x+')">'+(x?x+' GB':tr('Без лимита'))+'</button>').join('')+'</div><label>'+tr('Свой лимит, GB')+'<input id="wc" type="number" min="0" placeholder="например 250" value="'+(d.custom_gb||'')+'" oninput="WIZ.data.custom_gb=Number(this.value||0)"></label><div class="grid"><label>'+tr('Лимит IP')+'<input id="wip" type="number" min="0" value="'+d.ip_limit+'"></label><label>'+tr('Лимит HWID')+'<input id="whw" type="number" min="0" value="'+d.hwid_limit+'"></label></div><div class="hint">0 = '+tr('без лимита')+'</div>';
  }else if(WIZ.step===3){
    if(WIZ.mode==='existing')b.innerHTML='<div class="summary"><b>'+tr('Готово к созданию')+'</b><br>'+tr('Новый UUID будет создан автоматически.')+'<br>'+tr('Параметры Reality будут взяты из выбранного inbound.')+'</div>';
    else b.innerHTML='<div class="grid"><label>'+tr('Название inbound')+'<input id="wr" value="'+esc(d.remark)+'"></label><label>'+tr('Порт')+'<input id="wp" type="number" value="'+d.port+'"></label></div><label>SNI<input id="ws" placeholder="www.microsoft.com" value="'+esc(d.sni)+'"></label><label>Destination<input id="wdest" placeholder="www.microsoft.com:443" value="'+esc(d.dest)+'"></label><label>Fingerprint<select id="wf"><option>chrome</option><option>firefox</option><option>safari</option><option>edge</option></select></label><div class="hint">'+tr('Private key, public key и Short ID генерируются автоматически.')+'</div>';
  }else{
    b.innerHTML='<div class="summary"><b>✓ '+tr('Проверка')+'</b><br><b>'+tr('Клиент')+':</b> '+esc(d.email)+'<br><b>'+tr('Сценарий')+':</b> '+(WIZ.mode==='new'?tr('Новый VLESS Reality'):tr('Существующий inbound'))+'<br><b>'+tr('Трафик')+':</b> '+(d.custom_gb?d.custom_gb+' GB':(d.total_gb?d.total_gb+' GB':tr('Без лимита')))+'<br><b>'+tr('Срок')+':</b> '+(d.days?d.days+' '+tr('дней'):tr('Без срока'))+'<br><b>IP:</b> '+(d.ip_limit||tr('без лимита'))+' · <b>HWID:</b> '+(d.hwid_limit||tr('без лимита'))+(WIZ.mode==='new'?'<br><b>SNI:</b> '+esc(d.sni)+'<br><b>Destination:</b> '+esc(d.dest):'')+'</div>';
  }
}
function setWizGb(x){WIZ.data.total_gb=x;WIZ.data.custom_gb=0;renderWizard()}
function wizCollect(){
  let d=wizData();
  if(WIZ.step===1&&WIZ.mode==='existing'){d.inbound_id=Number($('wi')?.value||0);if(!d.inbound_id)throw Error('Выбери inbound')}
  if(WIZ.step===2){d.email=$('we').value.trim();if(!d.email)throw Error('Укажи имя клиента');d.days=Math.max(0,Number($('wd').value||0));d.ip_limit=Math.max(0,Number($('wip').value||0));d.hwid_limit=Math.max(0,Number($('whw').value||0));d.custom_gb=Number($('wc').value||0);if(d.custom_gb>0)d.total_gb=d.custom_gb}
  if(WIZ.step===3&&WIZ.mode==='new'){d.remark=$('wr').value.trim()||'VLESS Reality';d.port=Number($('wp').value||443);d.sni=$('ws').value.trim();d.dest=$('wdest').value.trim();d.fingerprint=$('wf').value;if(!d.sni||!d.dest)throw Error('Заполни SNI и Destination')}
}
function wizBack(){if(WIZ.step>1){WIZ.step--;renderWizard()}}
async function wizNext(){
  try{wizCollect();if(WIZ.step<4){WIZ.step++;renderWizard();return}
  let b=$('wizNext');b.disabled=true;b.textContent=LANG==='en'?'Creating…':'Создание…';let cfg=await api('/api/settings'),address=cfg.server_address||prompt(LANG==='en'?'Server address / domain':'Server address / домен');if(!address)throw Error('Не указан server address');let d=WIZ.data,r;
  if(WIZ.mode==='new')r=await api('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({remark:d.remark,port:d.port,sni:d.sni,dest:d.dest,fingerprint:d.fingerprint,email:d.email,total_gb:d.total_gb,days:d.days,ip_limit:d.ip_limit,hwid_limit:d.hwid_limit,server_address:address})});
  else r=await api('/api/clients/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:d.email,inbound_id:d.inbound_id,total_gb:d.total_gb,days:d.days,ip_limit:d.ip_limit,hwid_limit:d.hwid_limit,server_address:address})});
  links[d.email]=r.link;$('msg').innerHTML='<div class="wizard"><h3 class="ok">✓ '+tr('Клиент создан')+'</h3><div class="summary"><b>'+esc(d.email)+'</b><br><br>'+esc(r.link)+'</div><div class="actions" style="margin-top:10px"><button onclick="copyLink(\''+esc(d.email).replace(/'/g,"\\\\'")+'\')">📋 '+tr('Скопировать')+'</button><button onclick="telegram(\''+esc(d.email).replace(/'/g,"\\\\'")+'\')">✈ Telegram</button><button onclick="showWizardQr(\''+esc(d.email).replace(/'/g,"\\\\'")+'\')">▦ QR</button></div><div id="wizQr"></div></div>';load();
  }catch(e){if($('wizNext')){$('wizNext').disabled=false;$('wizNext').textContent=WIZ.step===4?(LANG==='en'?'Create':'Создать'):'Далее →'}out('Ошибка: '+e.message)}
}

async function showWizardQr(email){try{let l=await getLink(email),q=await api('/api/qr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link:l})});$('wizQr').innerHTML='<img alt="QR" style="width:280px;max-width:100%;margin-top:10px" src="data:image/png;base64,'+q.png_base64+'>'}catch(e){out('Ошибка: '+e.message)}}

applyLang();load();setInterval(()=>loadClients().catch(()=>{}),15000);setInterval(()=>panelInfo().catch(()=>{}),60000);
</script></body></html>
